    <line x1="10" y1="590" x2="117" y2="590" />
    <line x1="10" y1="600" x2="117" y2="600" />
    <line x1="10" y1="610" x2="117" y2="610" />
    <line x1="10" y1="620" x2="117" y2="620" />
    <line x1="10" y1="630" x2="117" y2="630" />
    <line x1="10" y1="640" x2="117" y2="640" />
    <line x1="10" y1="650" x2="117" y2="650" />
    <line x1="10" y1="660" x2="117" y2="660" />
    
    <line x1="117" y1="570" x2="117" y2="670" stroke-width="2" stroke="#1e293b" />

    <line x1="117" y1="580" x2="225" y2="580" />
    <line x1="117" y1="590" x2="225" y2="590" />
    <line x1="117" y1="600" x2="225" y2="600" />
    <line x1="117" y1="610" x2="225" y2="610" />
    <line x1="117" y1="620" x2="225" y2="620" />
    <line x1="117" y1="630" x2="225" y2="630" />
    <line x1="117" y1="640" x2="225" y2="640" />
    <line x1="117" y1="650" x2="225" y2="650" />
    <line x1="117" y1="660" x2="225" y2="660" />
  </g>

  <!-- Room 304 -->
  <rect x="10" y="680" width="215" height="150" fill="#cce4f0" opacity="0.9" stroke="#1e293b" stroke-width="2" />
  <!-- Room 305 -->
  <rect x="10" y="830" width="215" height="218" fill="#cce4f0" opacity="0.9" stroke="#1e293b" stroke-width="2" />

