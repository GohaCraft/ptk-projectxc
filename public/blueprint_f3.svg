  <line x1="880" y1="190" x2="980" y2="190" stroke="#475569" stroke-width="1.5" />
  <line x1="880" y1="200" x2="980" y2="200" stroke="#475569" stroke-width="1.5" />
  <line x1="880" y1="210" x2="980" y2="210" stroke="#475569" stroke-width="1.5" />
  
  <!-- Classrooms 334-336 in B2 -->
  <rect x="784" y="525" width="206" height="200" fill="#fbcfe8" opacity="0.9" stroke="#1e293b" stroke-width="2.5" />

