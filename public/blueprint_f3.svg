    <line x1="286.1" y1="360" x2="350" y2="360" />
    <line x1="286.1" y1="370" x2="350" y2="370" />
    <line x1="286.1" y1="380" x2="350" y2="380" />
    <line x1="710" y1="350" x2="774" y2="350" />
    <line x1="710" y1="360" x2="774" y2="360" />
    <line x1="710" y1="370" x2="774" y2="370" />
    <line x1="710" y1="380" x2="774" y2="380" />
  </g>

