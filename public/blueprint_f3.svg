  <rect x="854" y="10" width="70" height="90" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <rect x="924" y="10" width="66" height="90" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  
