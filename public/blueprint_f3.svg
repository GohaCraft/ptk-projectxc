      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1000" height="1058" fill="url(#grid)" />

  <!-- ========================================================== -->
  <!-- LEFT BLOCK B1 (u: 0 -> 276.1, v: 99.3 -> 1058.0) -->
  <!-- ========================================================== -->

  <!-- Colored Rooms of Block B1 (Typical Floor 3 Plan) -->
  <!-- Room 313 (Computer lab) -->
  <rect x="10" y="109.3" width="215" height="110.7" fill="#cce4f0" opacity="0.9" stroke="#1e293b" stroke-width="2" />
  <!-- Corridor space -->
  <rect x="225" y="109.3" width="41.1" height="110.7" fill="#cce4f0" opacity="0.9" stroke="#1e293b" stroke-width="2" />
  <!-- Room 314 -->
  <rect x="10" y="220" width="215" height="50" fill="#cce4f0" opacity="0.9" stroke="#1e293b" stroke-width="2" />
  <!-- Classroom 315 -->
  <rect x="10" y="270" width="215" height="180" fill="#cce4f0" opacity="0.9" stroke="#1e293b" stroke-width="2" />
  <!-- Storage and utilities -->
