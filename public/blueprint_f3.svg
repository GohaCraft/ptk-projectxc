  <!-- ========================================================== -->
  <!-- TEXT RENDERING & LABELS -->
  <!-- ========================================================== -->
  <g font-family="'Inter', system-ui, sans-serif" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <!-- Left B1 Labels -->
    <text x="117" y="165" font-size="28">313</text>
    <text x="245" y="165" font-size="18">314</text>
    <text x="117" y="248" font-size="18">315</text>
    <text x="117" y="365" font-size="22">Комп. Класс</text>
    <text x="245" y="380" font-size="14">305</text>
    <text x="117" y="488" font-size="18">303</text>
    <text x="117" y="548" font-size="18">301</text>
    <text x="117" y="760" font-size="25">304</text>
    <text x="117" y="930" font-size="28">305</text>

    <!-- Center B Labels -->
    <text x="383" y="285" font-size="28">330</text>
    <text x="654" y="285" font-size="28">332</text>

    <!-- Right B2 Labels -->
    <text x="887" y="635" font-size="28" font-weight="900" fill="#9d174d" letter-spacing="2">Кабинет 334</text>
  </g>

  <!-- Compass Marker -->
  <g transform="translate(945, 995)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#64748b" stroke-width="2" />
    <line x1="0" y1="25" x2="0" y2="-25" stroke="#64748b" stroke-width="2" />
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#64748b" stroke-width="2" />
    <polygon points="0,-25 -8,-5 8,-5" fill="#ef4444" />
    <polygon points="0,25 -8,5 8,5" fill="#64748b" />
    <text x="0" y="-32" font-family="monospace" font-weight="bold" font-size="14" fill="#ef4444" text-anchor="middle">N</text>
