      <circle cx="0" cy="0" r="4" fill="#0f172a" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" transform="rotate(45)" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" transform="rotate(90)" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" transform="rotate(135)" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" transform="rotate(180)" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" transform="rotate(225)" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" transform="rotate(270)" />
      <path d="M-3,-15 L3,-15 L4,-12 L-4,-12 Z" fill="#0f172a" transform="rotate(315)" />
